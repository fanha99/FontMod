name: Release

# Chi DONG GOI (khong compile) - DLL game co ban quyen khong commit len repo public duoc.
# Quy trinh: build DLL o may -> copy out\FontMod.dll => release-assets\FontMod.dll -> commit
#           -> day tag vX.Y.Z (vd v1.1.3) -> Action gom zip + tao GitHub Release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:        # cho phep bam chay tay tu tab Actions

permissions:
  contents: write           # can de tao Release

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Kiem tra DLL da commit
        shell: pwsh
        run: |
          if (-not (Test-Path release-assets/FontMod.dll)) {
            throw "Thieu release-assets/FontMod.dll. Hay build o may roi copy DLL vao day va commit truoc khi day tag."
          }

      - name: Dong goi zip
        shell: pwsh
        run: ./package_release.ps1 -Dll release-assets/FontMod.dll

      - name: Tao ban sao ten on dinh (cho UMM auto-update)
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/FontMod-*.zip | Select-Object -First 1
          Copy-Item $zip.FullName dist/FontMod.zip -Force
          Write-Host "Assets:"; Get-ChildItem dist/*.zip | ForEach-Object { Write-Host "  $($_.Name)" }

      - name: Tao GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FontMod-*.zip
            dist/FontMod.zip
          generate_release_notes: true
